name: Build & Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # ── Windows / MSVC shared ────────────────────────────────────────────────────
  windows:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-v1.14.0-windows

      - name: Configure (shared runtime + editor)
        run: cmake -B build -A x64 -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=ON -DBUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: |
          $env:PATH = "${{ github.workspace }}\build\bin\Release;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure
        shell: pwsh

  # ── Windows / MSVC static ────────────────────────────────────────────────────
  windows-static:
    name: Windows (MSVC x64 static)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-v1.14.0-windows-static

      - name: Configure (static runtime)
        run: cmake -B build -A x64 -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

  # ── Linux / GCC shared ──────────────────────────────────────────────────────
  linux:
    name: Linux (GCC, shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            xorg-dev \
            libgtest-dev \
            libgmock-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/build/bin/Release:$LD_LIBRARY_PATH"
          ctest --test-dir build --output-on-failure

  # ── Linux / GCC runtime-only static ─────────────────────────────────────────
  linux-runtime-only:
    name: Linux (GCC, runtime-only static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libgmock-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_RUNTIME_ONLY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # ── WebGL / Emscripten ──────────────────────────────────────────────────────
  wasm:
    name: WebGL (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50

      - name: Configure
        run: |
          emcmake cmake -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_RUNTIME_ONLY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-wasm --parallel

      - name: Check output
        run: |
          ls build-wasm/Runtime/ || ls build-wasm/
          echo "WASM build succeeded"
