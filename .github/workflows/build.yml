name: Build & Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # ── Windows / MSVC shared ────────────────────────────────────────────────────
  windows:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-v1.14.0-windows

      - name: Configure (shared runtime + editor)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=ON -DBUILD_TESTS=ON -DBLUEPRINT_LUA=ON -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\install"

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Install (collect all DLLs into install/bin)
        run: cmake --install build --config Release

      - name: Run tests
        run: |
          $testBin = "${{ github.workspace }}\build\bin\Release"

          # Copy every DLL found anywhere under build/ to the test exe directory
          Write-Host "=== Copying all DLLs from build/ to test bin ==="
          Get-ChildItem -Path "${{ github.workspace }}\build" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.FullName) -> $testBin"
            Copy-Item $_.FullName -Destination $testBin -Force -ErrorAction SilentlyContinue
          }
          Write-Host "=== DLLs in test bin ==="
          Get-ChildItem $testBin -Filter "*.dll" | Select-Object -ExpandProperty Name

          ctest --test-dir build -C Release --output-on-failure
        shell: pwsh

  # ── Windows / MSVC static ────────────────────────────────────────────────────
  windows-static:
    name: Windows (MSVC x64 static)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-v1.14.0-windows-static

      - name: Configure (static runtime)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

  # ── Linux / GCC shared ──────────────────────────────────────────────────────
  linux:
    name: Linux (GCC, shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libgmock-dev liblua5.4-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_RUNTIME_ONLY=ON \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/build/bin/Release:$LD_LIBRARY_PATH"
          ctest --test-dir build --output-on-failure

  # ── Linux / GCC runtime-only static ─────────────────────────────────────────
  linux-runtime-only:
    name: Linux (GCC, runtime-only static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libgmock-dev liblua5.4-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_RUNTIME_ONLY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # ── Linux / GCC ASAN + UBSAN ─────────────────────────────────────────────────
  linux-asan:
    name: Linux (GCC, ASAN+UBSAN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libgmock-dev liblua5.4-dev

      - name: Configure (ASAN + UBSAN)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_RUNTIME_ONLY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests (ASAN)
        env:
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:abort_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build --output-on-failure

  # ── macOS / Clang ───────────────────────────────────────────────────────────
  macos:
    name: macOS (Clang, runtime-only static)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install googletest lua

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_RUNTIME_ONLY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # ── iOS / Xcode (build-only, no tests) ──────────────────────────────────────
  ios:
    name: iOS (Clang, runtime-only static, build-only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DBUILD_RUNTIME_ONLY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build
        run: |
          cmake --build build-ios --config Release \
            -- \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Check output
        run: |
          find build-ios -name "*.a" | head -5
          echo "iOS static lib build succeeded"

  # ── Android / NDK (build-only, no tests) ────────────────────────────────────
  android:
    name: Android (arm64-v8a, runtime-only shared, build-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Find NDK path
        id: ndk
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -1)
          echo "path=$NDK_PATH" >> $GITHUB_OUTPUT
          echo "NDK: $NDK_PATH"

      - name: Configure
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_RUNTIME_ONLY=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-android --parallel

      - name: Check output
        run: |
          find build-android -name "*.so" | head -5
          echo "Android shared lib build succeeded"

  # ── WebGL / Emscripten ──────────────────────────────────────────────────────
  wasm:
    name: WebGL (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50

      - name: Configure
        run: |
          emcmake cmake -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_RUNTIME_ONLY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-wasm --parallel

      - name: Check output
        run: |
          find build-wasm -name "libBlueprintRuntime.a" | xargs ls -lh
          echo "WASM build succeeded"

  # ── 微信/抖音小游戏（Emscripten + JS Bridge） ──────────────────────────────
  wxgame:
    name: WeChat/TikTok MiniGame (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50

      - name: Configure (wxgame)
        run: |
          emcmake cmake -B build-wxgame \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_RUNTIME_ONLY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DBLUEPRINT_WXGAME=ON

      - name: Build (runtime-example → BlueprintRuntime.js + .wasm)
        run: cmake --build build-wxgame --target runtime-example --parallel

      - name: Check output
        run: |
          echo "=== 产物列表 ==="
          find build-wxgame -name "runtime-example.js"   -exec ls -lh {} \;
          find build-wxgame -name "runtime-example.wasm" -exec ls -lh {} \;
          echo "=== WASM 包体大小 ==="
          find build-wxgame -name "*.wasm" -exec du -h {} \;
          echo "WXGame build succeeded"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueprintRuntime-wxgame
          path: |
            build-wxgame/**/runtime-example.js
            build-wxgame/**/runtime-example.wasm
          if-no-files-found: error
